# Publica una demo en vivo de tu fork en GitHub Pages.
#
# Para activarlo en tu propio fork:
#   Settings → Pages → Source: GitHub Actions
#
# La cámara necesita HTTPS, y GitHub Pages lo sirve por HTTPS, así que la demo
# funciona igual que la original. El build usa rutas relativas (base: './' en
# vite.config.js), así que anda sin importar el subdirectorio.

name: Demo en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
