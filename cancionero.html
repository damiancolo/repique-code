<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Cancionero · Repique Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<!--
  Cancionero de Repique Code. Se pega una canción con los acordes encima de la
  letra (o un enlace, o una captura) y sale la misma canción con el dibujo de las
  manos al lado de cada acorde.

  ?modo=cantar  → las figuras del modo cantar (GRADO_POR_FORMA_CANTAR)
  ?guia         → dentro de la guía del instrumento (modo cantar), con la estética
                  de la lámina; avisa cuánto mide y si ya tiene canción
                  (postMessage {tipo:'cancionero-alto', alto, conCancion})

  La traducción acorde → figura no usa IA: es la tabla de acordes.js al revés.
  Enlaces y capturas pasan por /lab/cancionero/leer, que sólo existe en la
  instancia oficial (estudioprompt.com). En cualquier otro lado se pega el texto.
  Dentro de un iframe le avisa al instrumento la tonalidad que deduce
  (postMessage {tipo:'cancionero-tono', tono}).
-->
<style>
  :root { --bg: #FFFFFF; --fg: #1A1A18; --fg3: #8A887E; --line: #D6D3CC; --acc: #E8700A; --caja: #FBFAF8; }
  /* ?guia: dentro de la guía del instrumento, con la estética de la lámina */
  /* En la guía el fondo deja ver un poco la cámara, como la lámina, pero
     sin perder la letra: crema al 58 % y la caja de texto al 70 %. */
  html.guia { --bg: rgba(246,243,238,0.58); --caja: rgba(255,255,255,0.70); }
  html.guia body { background: transparent; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }
  html.guia main { padding: 8px 9px 10px; }
  .cabeza-guia { display: none; font: 600 11px/1.3 Outfit, system-ui, sans-serif; color: #1A1A18; margin: 0 1px 5px; }
  .cabeza-guia span { font-weight: 300; color: #5A5850; }
  html.guia .cabeza-guia { display: flex; align-items: baseline; gap: 4px; }
  .cabeza-guia .tit { flex: 1; }
  .ir { display: none; font: 600 10px/1 'JetBrains Mono', monospace; letter-spacing: .06em; color: #F6F3EE;
    background: #1A1A18; border: 0; border-radius: 4px; padding: 4px 7px; cursor: pointer; }
  .ir.visible { display: inline-block; }
  html.guia #caja { min-height: 38px; font-size: 11px; padding: 7px 8px; border-color: #D6D3CC; }
  html.guia #estado { margin: 3px 1px 6px; font-size: 10px; min-height: 0; }

  #caja { width: 100%; min-height: 54px; resize: vertical; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: 13px/1.5 'JetBrains Mono', monospace; color: var(--fg); background: var(--caja); }
  #caja:focus { outline: 2px solid var(--acc); outline-offset: 1px; }
  body.soltando #caja { outline: 2px dashed var(--acc); }
  #estado { min-height: 18px; margin: 6px 2px 12px; font: 11px/1.5 'JetBrains Mono', monospace; color: var(--fg3); }

  #cancion { font: 14px/1.55 'JetBrains Mono', monospace; overflow-x: auto; }
  html.guia #cancion { font-size: 11px; }
  html.guia .tono { font-size: 10px; margin-bottom: 8px; }
  html.guia .tono b { font-size: 12px; }
  .tono { margin-bottom: 12px; font-size: 12px; color: var(--fg3); }
  .tono b { color: var(--acc); font-size: 14px; }
  .linea { white-space: pre; min-height: 1.55em; }
  .fila-ac { position: relative; height: 58px; }
  html.guia .fila-ac { height: 40px; }
  .ac { position: absolute; bottom: 0; display: flex; align-items: flex-end; gap: 3px; white-space: nowrap; }
  .ac .nom { color: var(--acc); font-weight: 700; line-height: 1.2; }
  .ac .mano { width: var(--mano, 84px); height: auto; display: block; }
  .ac .marca { font-size: 10px; color: var(--fg3); align-self: flex-start; }
  .ac.fuera .nom { text-decoration: underline dotted; }
  .txt { position: absolute; bottom: 0; white-space: pre; line-height: 1.2; }
  @media print { #caja, #estado { display: none; } }
</style>
<script>if (/[?&]guia/.test(location.search)) document.documentElement.classList.add('guia');</script>
</head>
<body>
<main>
  <div class="cabeza-guia">
    <button class="ir" id="b-guia" title="Volver a la guía (la canción queda guardada)">← guía</button>
    <span class="tit">Cancionero <span>· pega la canción: texto, enlace o captura</span></span>
    <button class="ir" id="b-cancion" title="Volver a la canción">canción →</button>
  </div>
  <textarea id="caja" spellcheck="false" rows="2"
    placeholder="Pega aquí la canción con los acordes"></textarea>
  <div id="estado"></div>
  <div id="cancion"></div>
</main>
<script type="module" src="./src/cancionero.js"></script>
</body>
</html>
