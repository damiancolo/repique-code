<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repique Code — Estudioprompt</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      font-weight: 300;
      color: #fff;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #video {
      position: fixed;
      top: -9999px;
      left: -9999px;
      width: 1px;
      height: 1px;
    }

    /* Header: logo + nombre de la herramienta */
    #header-app {
      position: fixed;
      top: 1.4rem;
      left: 1.8rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      z-index: 10;
      pointer-events: none;
    }

    #logo-ep {
      width: 26px;
      height: 26px;
      opacity: 0.65;
      flex-shrink: 0;
    }

    #header-text {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    #header-brand {
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.35;
      line-height: 1;
    }

    #header-nombre {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.65;
      line-height: 1;
    }

    #status {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.4;
      pointer-events: none;
      text-align: center;
    }

    #panel {
      position: fixed;
      left: 1.8rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1rem;
      z-index: 10;
    }

    #btn-start {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      padding: 0.55rem 1.8rem;
      font-size: 0.75rem;
      font-family: inherit;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    #btn-start:hover:not(:disabled) { border-color: #e63946; color: #e63946; }
    #btn-start:disabled              { opacity: 0.25; cursor: default; }
    #btn-start.activo                { border-color: #e63946; color: #e63946; }

    #btn-stop {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      padding: 0.55rem 1.8rem;
      font-size: 0.75rem;
      font-family: inherit;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    #btn-stop:hover:not(:disabled) { border-color: rgba(255,255,255,0.7); }
    #btn-stop:disabled              { opacity: 0.25; cursor: default; }

    #volume-wrap {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.45;
    }

    #volume {
      -webkit-appearance: none;
      width: 72px;
      height: 1px;
      background: rgba(255, 255, 255, 0.4);
      outline: none;
      cursor: pointer;
    }

    #volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>

  <div id="header-app">
    <img id="logo-ep" src="logo-ep.png" alt="Estudioprompt">
    <div id="header-text">
      <div id="header-brand">Estudioprompt</div>
      <div id="header-nombre">Repique Code</div>
    </div>
  </div>

  <div id="status">Iniciando cámara…</div>

  <div id="panel">
    <button id="btn-start" disabled>Arranca</button>
    <button id="btn-stop" disabled>&#9632;</button>
    <div id="volume-wrap">
      <span>Vol</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
